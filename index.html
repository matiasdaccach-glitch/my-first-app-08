<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1020">
    <title>Contador de eventos | Colegio Bolívar</title>
    <link rel="stylesheet" href="style.css">
    <script src="actions.js" defer></script>
  </head>
  <body>
    <main class="event-counter" aria-labelledby="event-title">
      <p class="eyebrow">Colegio Bolívar</p>

      <h1 id="event-title">Contador de eventos</h1>

      <form class="title-form" id="title-form">
        <label for="title-input">Título del evento</label>
        <div class="title-controls">
          <input
            id="title-input"
            name="title"
            type="text"
            maxlength="60"
            placeholder="Escribe el nombre del evento"
          >
          <button class="button button-secondary" type="submit">
            Actualizar título
          </button>
        </div>
      </form>

      <section class="counter-panel" aria-label="Contador">
        <p class="counter-label">Asistentes registrados</p>
        <output class="counter-value" id="counter-value" aria-live="polite">0</output>

        <div class="counter-controls">
          <button
            class="button button-neon"
            id="decrease-button"
            type="button"
            aria-label="Restar un asistente"
          >
            −
          </button>
          <button
            class="button button-neon"
            id="increase-button"
            type="button"
            aria-label="Sumar un asistente"
          >
            +
          </button>
        </div>

        <button class="button button-reset" id="reset-button" type="button">
          Reiniciar contador
        </button>
      </section>
    </main>
  </body>
</html>
