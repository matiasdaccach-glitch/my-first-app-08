<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">
  <title>Contador de eventos | Colegio Bolívar</title>
  <style>
    :root {
      color-scheme: dark;
      --texto: #f2f7fc;
      --texto-suave: #9aacc1;
      --cian: #52e4f5;
      --rojo: #ff8296;
      --borde: rgba(148, 178, 210, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      overflow-x: hidden;
      color: var(--texto);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 50% -15%, rgba(52, 112, 183, 0.3), transparent 48%),
        radial-gradient(ellipse at 0% 100%, rgba(20, 143, 164, 0.13), transparent 38%),
        radial-gradient(ellipse at 100% 90%, rgba(92, 93, 191, 0.15), transparent 38%),
        #07111f;
    }

    body::before {
      position: fixed;
      z-index: -1;
      inset: 0;
      content: "";
      pointer-events: none;
      opacity: 0.2;
      background-image:
        linear-gradient(rgba(160, 190, 220, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(160, 190, 220, 0.07) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    .contenedor {
      width: min(100%, 540px);
    }

    .encabezado {
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 0 6px;
    }

    .marca {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .marca-icono {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      color: #07111f;
      background: linear-gradient(145deg, #8cf2f7, #57b9e8);
      border-radius: 13px;
      box-shadow: 0 8px 24px rgba(82, 228, 245, 0.18);
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: -0.06em;
    }

    .marca-texto strong,
    .marca-texto span {
      display: block;
    }

    .marca-texto strong {
      font-size: 0.88rem;
      letter-spacing: 0.01em;
    }

    .marca-texto span {
      margin-top: 3px;
      color: var(--texto-suave);
      font-size: 0.75rem;
    }

    .estado {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #b6c7d9;
      font-size: 0.75rem;
    }

    .estado::before {
      width: 7px;
      height: 7px;
      content: "";
      background: #55dfa0;
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(85, 223, 160, 0.75);
    }

    .tarjeta {
      position: relative;
      overflow: hidden;
      padding: clamp(26px, 7vw, 42px);
      background: linear-gradient(145deg, rgba(17, 35, 58, 0.96), rgba(10, 22, 39, 0.96));
      border: 1px solid var(--borde);
      border-radius: 26px;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.38),
        inset 0 1px 0 rgba(255, 255, 255, 0.045);
      backdrop-filter: blur(16px);
    }

    .tarjeta::before {
      position: absolute;
      top: 0;
      left: 12%;
      width: 76%;
      height: 1px;
      content: "";
      background: linear-gradient(90deg, transparent, rgba(104, 221, 241, 0.6), transparent);
    }

    .sobrelinea {
      margin: 0 0 10px;
      color: var(--cian);
      font-size: 0.7rem;
      font-weight: 750;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 6vw, 2.35rem);
      letter-spacing: -0.045em;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .descripcion {
      margin: 12px 0 24px;
      color: var(--texto-suave);
      font-size: 0.93rem;
      line-height: 1.6;
    }

    .campo-etiqueta {
      display: block;
      margin-bottom: 8px;
      color: #b8c9dc;
      font-size: 0.78rem;
      font-weight: 650;
    }

    .campo-titulo {
      width: 100%;
      min-height: 48px;
      margin-bottom: 22px;
      padding: 12px 14px;
      color: var(--texto);
      background: rgba(4, 14, 26, 0.68);
      border: 1px solid rgba(117, 158, 196, 0.24);
      border-radius: 12px;
      font: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .campo-titulo::placeholder {
      color: #71869d;
    }

    .campo-titulo:focus {
      border-color: var(--cian);
      box-shadow: 0 0 0 3px rgba(82, 228, 245, 0.12);
    }

    .marco-contador {
      margin-bottom: 22px;
      padding: 22px;
      text-align: center;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(54, 159, 190, 0.13), transparent 72%),
        rgba(4, 14, 26, 0.68);
      border: 1px solid rgba(117, 158, 196, 0.16);
      border-radius: 19px;
    }

    .etiqueta-contador {
      color: #8ea5bd;
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    #contador {
      margin: 12px 0 8px;
      color: var(--cian);
      font-size: clamp(4.5rem, 22vw, 6rem);
      font-weight: 760;
      line-height: 1;
      letter-spacing: -0.06em;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 34px rgba(82, 228, 245, 0.22);
      transition: color 180ms ease;
    }

    #contador.negativo {
      color: var(--rojo);
      text-shadow: 0 0 34px rgba(255, 130, 150, 0.2);
    }

    #mensaje {
      min-height: 1.25rem;
      margin: 0;
      color: #90a5ba;
      font-size: 0.78rem;
    }

    .controles {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
    }

    button {
      min-height: 52px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      padding: 12px 16px;
      border: 1px solid transparent;
      border-radius: 13px;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition:
        transform 150ms ease,
        box-shadow 150ms ease,
        background 150ms ease,
        border-color 150ms ease;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    button:focus-visible {
      outline: 3px solid rgba(255, 255, 255, 0.9);
      outline-offset: 3px;
    }

    .icono-boton {
      font-size: 1.15rem;
      line-height: 1;
    }

    .sumar {
      color: #061522;
      background: linear-gradient(135deg, #75f0f3, #44c9e7);
      box-shadow: 0 8px 22px rgba(51, 211, 232, 0.18);
    }

    .sumar:hover {
      box-shadow: 0 10px 28px rgba(51, 211, 232, 0.32);
    }

    .restar {
      color: #e8f1fb;
      background: rgba(39, 59, 83, 0.72);
      border-color: rgba(141, 168, 196, 0.2);
    }

    .restar:hover {
      background: rgba(51, 75, 103, 0.9);
      border-color: rgba(141, 190, 220, 0.34);
    }

    .reiniciar {
      grid-column: 1 / -1;
      min-height: 46px;
      color: #ffb2bf;
      background: rgba(80, 34, 54, 0.35);
      border-color: rgba(255, 130, 150, 0.2);
      font-size: 0.82rem;
    }

    .reiniciar:hover {
      background: rgba(106, 42, 66, 0.52);
      border-color: rgba(255, 130, 150, 0.42);
      box-shadow: 0 8px 22px rgba(255, 77, 116, 0.1);
    }

    .pie-tarjeta {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 18px 2px 0;
      color: #71869d;
      font-size: 0.73rem;
      line-height: 1.45;
    }

    .pie-tarjeta span:first-child {
      color: #90a9c1;
      font-size: 0.95rem;
    }

    @media (max-width: 440px) {
      .encabezado {
        align-items: flex-start;
      }

      .estado {
        margin-top: 6px;
      }

      .tarjeta {
        border-radius: 21px;
      }

      .marco-contador {
        padding: 20px 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="contenedor">
    <header class="encabezado">
      <div class="marca">
        <div class="marca-icono" aria-hidden="true">CB</div>
        <div class="marca-texto">
          <strong>Colegio Bolívar</strong>
          <span>Panel de eventos</span>
        </div>
      </div>
      <span class="estado">Contador activo</span>
    </header>

    <section class="tarjeta" aria-labelledby="tituloEvento">
      <p class="sobrelinea">Registro en vivo</p>
      <h1 id="tituloEvento">Contador de eventos</h1>
      <p class="descripcion">
        Registra la actividad del evento sumando o restando clicks.
        El conteo puede ser positivo o negativo.
      </p>

      <label class="campo-etiqueta" for="entradaTitulo">Título del evento</label>
      <input
        class="campo-titulo"
        id="entradaTitulo"
        type="text"
        placeholder="Escribe el nombre del evento"
        maxlength="80"
        autocomplete="off"
      >

      <div class="marco-contador">
        <span class="etiqueta-contador">Clicks registrados</span>
        <div id="contador" aria-live="polite" aria-atomic="true">0</div>
        <p id="mensaje" role="status">Listo para comenzar</p>
      </div>

      <div class="controles">
        <button class="sumar" id="botonSumar" type="button">
          <span class="icono-boton" aria-hidden="true">＋</span>
          Sumar click
        </button>
        <button class="restar" id="botonRestar" type="button">
          <span class="icono-boton" aria-hidden="true">−</span>
          Restar click
        </button>
        <button class="reiniciar" id="botonReiniciar" type="button">
          Reiniciar contador
        </button>
      </div>

      <p class="pie-tarjeta">
        <span aria-hidden="true">ⓘ</span>
        Reiniciar devuelve el valor a cero y pide confirmación.
      </p>
    </section>
  </main>

  <script>
    let clicks = 0;

    const contador = document.getElementById("contador");
    const mensaje = document.getElementById("mensaje");
    const entradaTitulo = document.getElementById("entradaTitulo");
    const tituloEvento = document.getElementById("tituloEvento");

    entradaTitulo.addEventListener("input", () => {
      const titulo = entradaTitulo.value.trim();

      tituloEvento.textContent = titulo || "Contador de eventos";
      document.title = titulo
        ? `${titulo} | Colegio Bolívar`
        : "Contador de eventos | Colegio Bolívar";
    });

    function actualizarContador(texto) {
      contador.textContent = clicks;
      contador.classList.toggle("negativo", clicks < 0);
      mensaje.textContent = texto;
    }

    document.getElementById("botonSumar").addEventListener("click", () => {
      clicks += 1;
      actualizarContador("Click agregado");
    });

    document.getElementById("botonRestar").addEventListener("click", () => {
      clicks -= 1;
      actualizarContador("Click restado");
    });

    document.getElementById("botonReiniciar").addEventListener("click", () => {
      if (confirm("¿Quieres reiniciar el contador a cero?")) {
        clicks = 0;
        actualizarContador("Contador reiniciado");
      }
    });
  </script>
</body>
</html>
